<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aviator Predictor — Demo</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#080b16;color:#fff;min-height:100vh}
.wrap{max-width:560px;margin:auto;padding:24px 16px}.card{background:#111729;border:1px solid #27304a;border-radius:22px;padding:24px;box-shadow:0 16px 50px #0008}
h1{margin:0 0 8px;font-size:30px}p{color:#aeb7cc;line-height:1.5}.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#252d48;color:#b9c6ff;font-size:12px;margin-bottom:14px}
.mult{font-size:64px;font-weight:800;text-align:center;margin:26px 0;color:#fff}.btn{width:100%;padding:15px;border:0;border-radius:14px;background:#5d6cff;color:white;font-size:17px;font-weight:700;cursor:pointer}.btn:active{transform:scale(.99)}
.note{font-size:12px;color:#8893aa;margin-top:16px}.history{margin-top:22px}.row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #222b42;color:#cbd3e4}
.lang{float:right;background:#1b2338;color:#fff;border:1px solid #303b59;border-radius:10px;padding:7px}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<button class="lang" onclick="toggleLang()">OR / EN</button>
<div class="badge" id="badge">DEMO</div>
<h1 id="title">Aviator Predictor</h1>
<p id="desc">Generate a simulated multiplier for testing your interface. This is not a real prediction.</p>
<div class="mult" id="mult">—</div>
<button class="btn" id="scan" onclick="scan()">SCAN / GENERATE</button>
<div class="history"><b id="histTitle">History</b><div id="history"></div></div>
<div class="note" id="note">For demonstration only. Aviator results cannot be reliably predicted in advance.</div>
</div></div>
<script>
let oromo=false;
function scan(){
 const m=(1.05+Math.random()*8.95).toFixed(2)+'x';
 document.getElementById('mult').textContent='Scanning…';
 setTimeout(()=>{document.getElementById('mult').textContent=m;
 const r=document.createElement('div');r.className='row';r.innerHTML='<span>Demo result</span><strong>'+m+'</strong>';
 document.getElementById('history').prepend(r);
 },700);
}
function toggleLang(){
 oromo=!oromo;
 document.getElementById('title').textContent=oromo?'Aviator Predictor — Fakkeenya':'Aviator Predictor';
 document.getElementById('desc').textContent=oromo?'Multiplier fakkeenyaa qofa uuma. Prediction dhugaa miti.':'Generate a simulated multiplier for testing your interface. This is not a real prediction.';
 document.getElementById('scan').textContent=oromo?'SAANI / UUMI':'SCAN / GENERATE';
 document.getElementById('histTitle').textContent=oromo?'Seenaa':'History';
 document.getElementById('note').textContent=oromo?'Fakkeenya qofa. Bu’aan Aviator dursee amanamummaadhaan tilmaamamuu hin danda’u.':'For demonstration only. Aviator results cannot be reliably predicted in advance.';
}
</script>
</body></html>
